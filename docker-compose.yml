services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pr
      POSTGRES_PASSWORD: pr
      POSTGRES_DB: politierechter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: ./app
    environment:
      DATABASE_URL: postgres://pr:pr@db:5432/politierechter
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]
    depends_on: [db]
  worker:
    build: ./app
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      DATABASE_URL: postgres://pr:pr@db:5432/politierechter
    depends_on: [db]
volumes:
  pgdata:
