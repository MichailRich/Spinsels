# Render.com Blueprint — zet de hele site met één klik online:
# Render dashboard → New → Blueprint → kies deze GitHub-repository.
# Maakt aan: database (PostgreSQL), website en achtergrondimport.
databases:
  - name: politierechter-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: politierechter-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: app
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politierechter-db, property: connectionString }
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://politierechter.nl
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: politierechter-import
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: app
    buildCommand: npm ci
    startCommand: npx tsx scripts/worker.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: politierechter-db, property: connectionString }
      - key: NODE_VERSION
        value: "22"
